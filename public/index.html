<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/gif" href="%PUBLIC_URL%/images/IconTab.gif" />
    <link
      rel="shortcut icon"
      type="image/gif"
      href="%PUBLIC_URL%/images/IconTab.gif"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0a0a" />
    <meta
      name="description"
      content="Sougueur Records — powerlifting leaderboard"
    />

    <!-- Open Graph / link-preview tags (WhatsApp, iMessage, Slack, Discord, etc.) -->
    <meta property="og:title" content="Sougueur Records" />
    <meta
      property="og:description"
      content="Sougueur Records — powerlifting leaderboard"
    />
    <meta
      property="og:image"
      content="https://mlsvmdl.github.io/gym_records/images/social-preview.jpg"
    />
    <meta property="og:url" content="https://mlsvmdl.github.io/gym_records/" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card (Twitter/X uses these instead of the og: tags above) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sougueur Records" />
    <meta
      name="twitter:description"
      content="Sougueur Records — powerlifting leaderboard"
    />
    <meta
      name="twitter:image"
      content="https://mlsvmdl.github.io/gym_records/images/social-preview.jpg"
    />

    <!-- Use a static branded PNG here, not the CRA default logo192.png -->
    <link
      rel="apple-touch-icon"
      href="%PUBLIC_URL%/images/apple-touch-icon.png"
    />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Sougueur Records</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
